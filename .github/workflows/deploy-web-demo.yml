name: Deploy web demo

on:
  # Republish the demo whenever main moves.
  push:
    branches: [main]
  # Keep the manual trigger for redeploying without a code change.
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Served from the root of the custom domain (myzippy.app), so the default
      # base of '/' in vite.config.ts is correct and nothing is overridden here.
      # public/CNAME travels with the artifact and keeps the domain bound.
      - run: npm run build:web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
