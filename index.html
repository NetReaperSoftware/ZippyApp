<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Static hosting has no server-side redirects, so the root sends visitors to
      /landing/ three ways: a meta refresh (works without JS), a script (fires
      immediately, and uses replace() so Back doesn't bounce), and a visible link
      as the final fallback.
    -->
    <meta http-equiv="refresh" content="0; url=/landing/" />
    <link rel="canonical" href="https://myzippy.app/landing/" />
    <title>MyZippy</title>
    <script>
      window.location.replace('/landing/');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #050a12;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      a {
        color: #39e639;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="/landing/">myzippy.app/landing</a>…</p>
  </body>
</html>
