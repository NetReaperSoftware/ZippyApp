<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>MyZippy — Never miss a call, client, or dollar</title>
    <meta
      name="description"
      content="MyZippy is an AI-powered revenue recovery system for small business owners. Try the demo."
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
      /* react-native-web maps flex containers onto these; without a full-height
         root the app collapses to zero height. */
      #root {
        display: flex;
        height: 100%;
      }
      #root > * {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
